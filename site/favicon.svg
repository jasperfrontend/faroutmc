<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" shape-rendering="crispEdges">
  <title>Farout</title>
  <defs>
    <linearGradient id="fill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2ff3e0"/>
      <stop offset="1" stop-color="#3ee07f"/>
    </linearGradient>
  </defs>

  <rect width="16" height="16" fill="#08101c"/>

  <!-- F and O on a 16px grid: 14 blocks wide (2-block gap), 1 block margin left and right, 4 above and below -->
