name: ci

# The website (site/, deployed with wrangler) doesn't touch the mod, so it skips the gate.
on:
  push:
    branches: [main]
    paths-ignore: ['site/**', 'wrangler.jsonc']
  pull_request:
    paths-ignore: ['site/**', 'wrangler.jsonc']

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v5

      # build: compiles main and client, remaps the jar.
      # runGameTest: boots a dedicated server with the mod, which fails on a broken mixin, registry
      # or datapack JSON, then runs src/gametest and exits non-zero if any test fails.
      - run: ./gradlew build runGameTest
